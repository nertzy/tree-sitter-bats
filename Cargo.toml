[package]
authors = [ "Grant Hutchins <git@nertzy.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Bats (Bash Automated Testing System) grammar for tree-sitter, extending tree-sitter-bash."
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "bats" ]
license = "MIT"
name = "tree-sitter-bats"
readme = "README.md"
repository = "https://github.com/nertzy/tree-sitter-bats"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
