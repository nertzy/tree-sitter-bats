name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) \
            1.7.12 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: actionlint
      - run: npm run lint

  test:
    name: Test parser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # parser-test-action runs `npm ci` to get tree-sitter-bash's grammar.js.
      # Skip this package's install script, which builds the unused Node addon
      # and fails on windows-latest, where node-gyp 11 rejects Visual Studio 2026.
      npm_config_ignore_scripts: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          # Keep in sync with the exact tree-sitter-cli version in package.json.
          tree-sitter-ref: v0.27.0
      - uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63 # v3
        with:
          generate: true
          test-rust: true
          test-python: true
          test-go: true

  examples:
    name: Parse example Bats suites
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          # Keep in sync with the exact tree-sitter-cli version in package.json.
          tree-sitter-ref: v0.27.0
      - run: script/fetch-examples
      - uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: examples/**/*.bats
          invalid-files-list: script/known-failures.txt
