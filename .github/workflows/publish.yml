name: Publish

# A v<version> tag builds every package, then publishes to npm (staged for
# approval), crates.io, and PyPI through trusted publishing, and creates the
# GitHub Release. Pull requests that touch packaging and manual runs build and
# smoke-test the packages without publishing. See RELEASING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - script/check-release
      - script/release-notes
      - binding.gyp
      - bindings/node/**
      - bindings/python/**
      - Cargo.lock
      - Cargo.toml
      - CMakeLists.txt
      - Makefile
      - package.json
      - package-lock.json
      - pyproject.toml
      - setup.py
      - tree-sitter.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(script/check-release)" >> "$GITHUB_OUTPUT"

  build-wasm:
    name: Build Wasm
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          # Keep in sync with the exact tree-sitter-cli version in package.json.
          tree-sitter-ref: v0.27.0
      - run: tree-sitter build --wasm --output tree-sitter-bats.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: tree-sitter-bats.wasm
          if-no-files-found: error

  build-node:
    name: Build Node.js binary (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2022
          - windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      # A Node-API build, so one binary per platform serves every Node.js version.
      - run: npx prebuildify --target 20.19.5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/**
          if-no-files-found: error

  pack-npm:
    name: Pack npm package
    needs: [check, build-wasm, build-node]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
      - name: Pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          npm pack
          tarball="tree-sitter-bats-$VERSION.tgz"
          tar -tzf "$tarball" > "$RUNNER_TEMP/contents"
          grep -qx package/tree-sitter-bats.wasm "$RUNNER_TEMP/contents"
          binaries=$(grep -c '^package/prebuilds/.*\.node$' "$RUNNER_TEMP/contents")
          if [ "$binaries" -ne 6 ]; then
            echo "::error::Expected 6 prebuilt binaries, found $binaries"
            exit 1
          fi
      - name: Smoke-test the packed tarball
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          smoke_dir=$(mktemp -d)
          npm install --prefix "$smoke_dir" --no-audit --no-fund \
            "$PWD/tree-sitter-bats-$VERSION.tgz" tree-sitter@0.25
          cd "$smoke_dir"
          node --input-type=module -e '
            import Parser from "tree-sitter";
            import Bats from "tree-sitter-bats";
            const parser = new Parser();
            parser.setLanguage(Bats);
            const { rootNode } = parser.parse("@test \"smoke\" {\n  run true\n}\n");
            if (rootNode.hasError || rootNode.firstChild.type !== "test_block" || !Bats.HIGHLIGHTS_QUERY) {
              console.error(rootNode.toString());
              process.exit(1);
            }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: tree-sitter-bats-${{ needs.check.outputs.version }}.tgz
          if-no-files-found: error

  package-crate:
    name: Package Rust crate
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the packaged crate from its own file list.
      - run: cargo package

  build-sdist:
    name: Build Python source distribution
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build Python wheel (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish-npm:
    name: Stage npm package
    if: github.event_name == 'push'
    needs: [check, pack-npm, package-crate, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tree-sitter-bats
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - id: published
        name: Skip a version already on npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ "$(npm view "tree-sitter-bats@$VERSION" version 2> /dev/null || true)" = "$VERSION" ]; then
            echo "::notice::tree-sitter-bats@$VERSION is already on npm; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage package
        if: steps.published.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -o pipefail
          npm stage publish "./tree-sitter-bats-$VERSION.tgz" --access public --provenance 2>&1 \
            | tee "$RUNNER_TEMP/stage-output.txt"
          stage_id=$(sed -n 's/.*(staged with id \([^)]*\)).*/\1/p' "$RUNNER_TEMP/stage-output.txt")
          {
            echo "## tree-sitter-bats@$VERSION is staged on npm, not live yet"
            echo
            echo "Approve it with 2FA at https://www.npmjs.com/settings/nertzy/staged-packages?filterPackage=tree-sitter-bats&filterVersion=$VERSION"
            echo "or with \`npm stage approve ${stage_id:-<stage-id>}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=tree-sitter-bats@$VERSION staged::Approve the staged release on npmjs.com to make it installable."

  publish-crate:
    name: Publish Rust crate
    if: github.event_name == 'push'
    needs: [check, pack-npm, package-crate, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/tree-sitter-bats
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: published
        name: Skip a version already on crates.io
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if curl -fsS -o /dev/null -A "tree-sitter-bats release (https://github.com/nertzy/tree-sitter-bats)" \
            "https://crates.io/api/v1/crates/tree-sitter-bats/$VERSION"; then
            echo "::notice::tree-sitter-bats $VERSION is already on crates.io; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - id: auth
        if: steps.published.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    name: Publish Python package
    if: github.event_name == 'push'
    needs: [check, pack-npm, package-crate, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-bats/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [check, publish-npm, publish-crate, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tree-sitter-bats.wasm
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          script/release-notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" tree-sitter-bats.wasm \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
