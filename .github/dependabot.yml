version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
        # A CLI bump regenerates src/ and updates tree-sitter-ref in CI, so it gets its own PR.
        exclude-patterns: ["tree-sitter-cli"]
    ignore:
      # eslint-config-treesitter 1.0.2 supports ESLint 9 only: it imports an
      # undeclared `globals` and depends on eslint-plugin-jsdoc ^50.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
